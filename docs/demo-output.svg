<g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21"><text x="44" y="169" fill="#5eead4" xml:space="preserve">$ java -cp build FriendRecommendationDemo</text><text x="44" y="198" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="227" fill="#dbe5f4" xml:space="preserve">Synthetic undirected graph</text><text x="44" y="256" fill="#dbe5f4" xml:space="preserve">  1 -- 2</text><text x="44" y="285" fill="#dbe5f4" xml:space="preserve">  1 -- 3</text><text x="44" y="314" fill="#dbe5f4" xml:space="preserve">  2 -- 4</text><text x="44" y="343" fill="#dbe5f4" xml:space="preserve">  3 -- 4</text><text x="44" y="372" fill="#dbe5f4" xml:space="preserve">  3 -- 5</text><text x="44" y="401" fill="#dbe5f4" xml:space="preserve">  4 -- 6</text><text x="44" y="430" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="459" fill="#dbe5f4" xml:space="preserve">Common-neighbor recommendations for node 1</text><text x="44" y="488" fill="#dbe5f4" xml:space="preserve">  Node 4: 2 common neighbors</text><text x="44" y="517" fill="#dbe5f4" xml:space="preserve">  Node 5: 1 common neighbors</text><text x="44" y="546" fill="#dbe5f4" xml:space="preserve">  Node 6: 0 common neighbors</text><text x="44" y="575" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="604" fill="#dbe5f4" xml:space="preserve">Existing friends (2, 3) and node 1 are excluded.</text></g>
